name: Build Packages

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    name: Read build config
    runs-on: ubuntu-latest
    outputs:
      build_enabled: ${{ steps.config.outputs.build_enabled }}
      android_enabled: ${{ steps.config.outputs.android_enabled }}
      ios_enabled: ${{ steps.config.outputs.ios_enabled }}
      release_enabled: ${{ steps.config.outputs.release_enabled }}
      release_type: ${{ steps.config.outputs.release_type }}
      release_tag: ${{ steps.config.outputs.release_tag }}
      release_title: ${{ steps.config.outputs.release_title }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read config
        id: config
        shell: pwsh
        run: |
          $config = Get-Content -LiteralPath ".github/build-config.json" -Raw | ConvertFrom-Json
          $propertiesText = Get-Content -LiteralPath "gradle.properties" |
            Where-Object { $_ -match '\S' -and $_ -notmatch '^\s*[#!]' } |
            Out-String
          $properties = ConvertFrom-StringData $propertiesText
          $versionName = $properties["piko.versionName"]
          $versionCode = $properties["piko.versionCode"]
          if ([string]::IsNullOrWhiteSpace($versionName)) {
            throw "gradle.properties 缺少 piko.versionName"
          }
          if ([string]::IsNullOrWhiteSpace($versionCode)) {
            throw "gradle.properties 缺少 piko.versionCode"
          }
          if ($versionCode -notmatch '^\d+$') {
            throw "piko.versionCode 必须是整数，当前值：$versionCode"
          }
          "build_enabled=$($config.build.enabled.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "android_enabled=$($config.android.enabled.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "ios_enabled=$($config.ios.enabled.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "release_enabled=$($config.githubRelease.enabled.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "release_type=$($config.githubRelease.type)" >> $env:GITHUB_OUTPUT
          "release_tag=v$versionName" >> $env:GITHUB_OUTPUT
          "release_title=Piko v$versionName" >> $env:GITHUB_OUTPUT

  android-signed:
    name: Android signed APK
    runs-on: windows-2025-vs2026
    timeout-minutes: 15
    needs: prepare
    if: needs.prepare.outputs.build_enabled == 'true' && needs.prepare.outputs.android_enabled == 'true'
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PATH: keystores/piko-release.p12
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Restore Android release keystore
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_KEYSTORE_BASE64)) {
            throw "缺少 GitHub Secret：ANDROID_KEYSTORE_BASE64"
          }
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_KEYSTORE_PASSWORD)) {
            throw "缺少 GitHub Secret：ANDROID_KEYSTORE_PASSWORD"
          }
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_KEY_ALIAS)) {
            throw "缺少 GitHub Secret：ANDROID_KEY_ALIAS"
          }
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_KEY_PASSWORD)) {
            throw "缺少 GitHub Secret：ANDROID_KEY_PASSWORD"
          }
          New-Item -ItemType Directory -Force -Path android\keystores | Out-Null
          [IO.File]::WriteAllBytes(
            "android\keystores\piko-release.p12",
            [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64)
          )

      - name: Build Android packages
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\scripts\build-packages.ps1 -Platform android

      - name: Verify signed Android release APKs
        shell: pwsh
        run: |
          $apks = Get-ChildItem -LiteralPath "scripts\artifacts\android\release" -Filter "*.apk"
          if ($apks.Count -eq 0) {
            throw "未找到 Android 已签名 release APK"
          }
          $apksigner = Get-ChildItem -LiteralPath "$env:ANDROID_HOME\build-tools" -Recurse -Filter "apksigner.bat" |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          foreach ($apk in $apks) {
            & $apksigner verify --verbose --print-certs $apk.FullName
          }

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-packages
          path: scripts/artifacts/android

  ios-unsigned:
    name: iOS unsigned artifacts
    runs-on: macos-26
    timeout-minutes: 20
    needs: prepare
    if: needs.prepare.outputs.build_enabled == 'true' && needs.prepare.outputs.ios_enabled == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Restore Kotlin Native cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: Restore iOS incremental build cache
        uses: actions/cache@v5
        with:
          path: |
            .gradle
            composeApp/build
          key: ios-incremental-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', 'settings.gradle.kts', 'build.gradle.kts', 'composeApp/build.gradle.kts', 'composeApp/src/**') }}
          restore-keys: |
            ios-incremental-${{ runner.os }}-

      - name: Verify Xcode and iOS SDK
        shell: bash
        run: |
          set -euo pipefail
          xcode_candidates="$(python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = {}
          default = Path("/Applications/Xcode.app")
          if default.exists():
              candidates[str(default.resolve())] = (999, 999, 999, 0)

          for path in Path("/Applications").glob("Xcode_26*.app"):
              match = re.match(r"Xcode_(\d+(?:\.\d+){0,2})", path.name)
              if match:
                  parts = tuple(int(part) for part in match.group(1).split("."))
                  version = parts + (0,) * (3 - len(parts))
                  candidates[str(path.resolve())] = (*version, 1)

          if not candidates:
              raise SystemExit(1)

          for path, sort_key in sorted(candidates.items(), key=lambda item: item[1], reverse=True):
              print(path)
          PY
          )"

          selected_xcode=""
          selected_destinations=""
          while IFS= read -r candidate; do
            if [[ -z "$candidate" || ! -d "$candidate" ]]; then
              continue
            fi
            echo "检查 Xcode：$candidate"
            export DEVELOPER_DIR="$candidate/Contents/Developer"
            xcodebuild -version
            xcodebuild -showsdks
            sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
            case "$sdk_version" in
              26.*)
                echo "候选 iOS SDK：$sdk_version"
                ;;
              *)
                echo "跳过：当前 iOS SDK 不是 26.x：$sdk_version"
                continue
                ;;
            esac
            sdk_path="$(xcrun --sdk iphoneos --show-sdk-path)"
            if [[ -z "$sdk_path" || ! -d "$sdk_path" ]]; then
              echo "跳过：未找到 iPhoneOS SDK 路径：$sdk_path"
              continue
            fi
            destinations="$(xcodebuild \
              -project ios/PikoIOS/PikoIOS.xcodeproj \
              -scheme PikoIOS \
              -sdk iphoneos \
              -destination "generic/platform=iOS" \
              -showdestinations 2>&1 || true)"
            if grep -q "xcodebuild: error:" <<< "$destinations"; then
              echo "跳过：该 Xcode 无法解析 iOS 构建目标。"
              printf '%s\n' "$destinations"
              continue
            fi
            if grep -q "iOS .* is not installed" <<< "$destinations"; then
              echo "跳过：该 Xcode 的 iOS platform 未安装完整。"
              continue
            fi
            selected_xcode="$candidate"
            selected_destinations="$destinations"
            break
          done <<< "$xcode_candidates"

          if [[ -z "$selected_xcode" ]]; then
            echo "未找到可直接构建 iPhoneOS 的 Xcode 26，尝试为首个候选安装 iOS platform。" >&2
            selected_xcode="$(printf '%s\n' "$xcode_candidates" | head -n 1)"
            if [[ -z "$selected_xcode" || ! -d "$selected_xcode" ]]; then
              echo "未找到 Xcode 26：" >&2
              find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print >&2
              exit 1
            fi
            export DEVELOPER_DIR="$selected_xcode/Contents/Developer"
            xcodebuild -downloadPlatform iOS
            selected_destinations="$(xcodebuild \
              -project ios/PikoIOS/PikoIOS.xcodeproj \
              -scheme PikoIOS \
              -sdk iphoneos \
              -destination "generic/platform=iOS" \
              -showdestinations)"
          fi

          if [[ -z "$selected_xcode" || ! -d "$selected_xcode" ]]; then
            echo "未找到可用 Xcode 26：" >&2
            find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print >&2
            exit 1
          fi
          echo "选择 Xcode：$selected_xcode"
          export DEVELOPER_DIR="$selected_xcode/Contents/Developer"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          sdk_path="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "使用 iOS SDK $sdk_version 构建。"
          echo "iPhoneOS SDK 路径：$sdk_path"
          printf '%s\n' "$selected_destinations"

      - name: Build iOS unsigned artifacts
        shell: bash
        run: |
          chmod +x ./gradlew ./scripts/ios/build-packages.sh
          ./scripts/ios/build-packages.sh

      - name: Verify iOS unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          ipa_found=false
          while IFS= read -r ipa; do
            ipa_found=true
            unzip -tq "$ipa"
            unzip -l "$ipa" | grep -Eq 'Payload/[^/]+\.app/Info.plist'
            echo "已验证 iOS unsigned IPA：$ipa"
          done < <(find scripts/artifacts/ios -maxdepth 1 -type f -name "*.ipa" | sort)
          if [[ "$ipa_found" != "true" ]]; then
            echo "未找到 iOS unsigned IPA" >&2
            exit 1
          fi

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ios-unsigned-artifacts
          path: scripts/artifacts/ios
          if-no-files-found: error

      - name: Upload iOS Gradle profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-gradle-profile
          path: build/reports/profile
          if-no-files-found: ignore

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - prepare
      - android-signed
      - ios-unsigned
    if: >
      always() &&
      github.event_name != 'pull_request' &&
      needs.prepare.outputs.release_enabled == 'true' &&
      (needs.android-signed.result == 'success' || needs.ios-unsigned.result == 'success')
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Android artifacts
        if: needs.android-signed.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: android-packages
          path: release-input/android

      - name: Download iOS artifacts
        if: needs.ios-unsigned.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: ios-unsigned-artifacts
          path: release-input/ios

      - name: Prepare release assets and notes
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.prepare.outputs.release_tag }}"
          repo="${{ github.repository }}"
          version="${tag#v}"
          mkdir -p release-assets

          if [[ -d release-input/android/release ]]; then
            find release-input/android/release -type f -name "piko-${version}-android-*.apk" -exec cp {} release-assets/ \;
          fi
          if [[ -d release-input/ios ]]; then
            find release-input/ios -type f -name "piko-${version}-ios-unsigned.ipa" -exec cp {} release-assets/ \;
          fi
          if ! find release-assets -type f | grep -q .; then
            echo "没有可发布的安装包。" >&2
            exit 1
          fi

          {
            echo "## 更新内容"
            git log -1 --pretty=format:%B
            echo
            echo
            echo "## 版本下载"
          for asset in $(find release-assets -type f | sort); do
            name="$(basename "$asset")"
            url="https://github.com/$repo/releases/download/$tag/$name"
            case "$name" in
              piko-${version}-android-*.apk)
                arch="${name#piko-${version}-android-}"
                arch="${arch%.apk}"
                case "$arch" in
                  arm64-v8a)
                    audience="大多数现代 Android 手机和平板"
                    ;;
                  armeabi-v7a)
                    audience="老款 32 位 Android 设备"
                    ;;
                  x86_64)
                    audience="Android x86_64 模拟器或设备"
                    ;;
                  x86)
                    audience="旧版 Android x86 模拟器或设备"
                    ;;
                  *)
                    audience="Android $arch 设备"
                    ;;
                esac
                echo "- $audience 下载：[$name]($url)"
                ;;
              piko-${version}-ios-unsigned.ipa)
                echo "- iPhone 用户下载：[$name]($url)"
                ;;
              *)
                echo "- 其他用户下载：[$name]($url)"
                  ;;
              esac
            done
          } > release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          create_args=()
          edit_args=(--prerelease=false)
          if [[ "${{ needs.prepare.outputs.release_type }}" == "prerelease" ]]; then
            create_args+=(--prerelease)
            edit_args=(--prerelease)
          fi
          if gh release view "${{ needs.prepare.outputs.release_tag }}" >/dev/null 2>&1; then
            gh release upload "${{ needs.prepare.outputs.release_tag }}" release-assets/* --clobber
            gh release edit "${{ needs.prepare.outputs.release_tag }}" \
              --title "${{ needs.prepare.outputs.release_title }}" \
              --notes-file release-notes.md \
              "${edit_args[@]}"
          else
            gh release create "${{ needs.prepare.outputs.release_tag }}" release-assets/* \
              --title "${{ needs.prepare.outputs.release_title }}" \
              --notes-file release-notes.md \
              "${create_args[@]}"
          fi
