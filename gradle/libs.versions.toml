[versions]
agp = "9.0.0"
kotlin = "2.3.21"
compose = "1.10.3"
activityCompose = "1.13.0"
backdrop = "1.0.6"
kyantShapes = "1.2.0"
miuix = "0.8.8"
androidxSecurityCrypto = "1.1.0-alpha06"
bcprov = "1.82"
kotlinxCoroutinesAndroid = "1.10.1"
orgJson = "20250517"
okhttp = "4.12.0"
webrtcAndroid = "114.5735.10"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "androidxSecurityCrypto" }
backdrop = { module = "io.github.kyant0:backdrop", version.ref = "backdrop" }
bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bcprov" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose" }
compose-runtime = { module = "androidx.compose.runtime:runtime", version.ref = "compose" }
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutinesAndroid" }
kyant-shapes = { module = "io.github.kyant0:shapes", version.ref = "kyantShapes" }
miuix = { module = "top.yukonga.miuix.kmp:miuix-android", version.ref = "miuix" }
miuix-icons = { module = "top.yukonga.miuix.kmp:miuix-icons-android", version.ref = "miuix" }
org-json = { module = "org.json:json", version.ref = "orgJson" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
webrtc-android = { module = "io.github.webrtc-sdk:android", version.ref = "webrtcAndroid" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
